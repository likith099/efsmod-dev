# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - efsmod-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore aspnet-get-started.sln

      - name: Build ASP.NET MVC Application
        run: msbuild aspnet-get-started.sln /p:Configuration=Release

      - name: List build output (for debugging)
        run: |
          echo "Contents of aspnet-get-started directory:"
          Get-ChildItem -Path "aspnet-get-started" -Recurse -Name
          echo ""
          echo "Contents of aspnet-get-started\bin\Release:"
          if (Test-Path "aspnet-get-started\bin\Release") { 
            Get-ChildItem -Path "aspnet-get-started\bin\Release" -Recurse 
          } else { 
            echo "Release directory not found" 
          }

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-mvc-app
          path: aspnet-get-started/
          retention-days: 1
  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: aspnet-mvc-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0979D8158C7C494FBC27172D185CA0A6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0CCA157E6A80431DAD7EB13F259C79A5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_085E27B79358465CA5A9F46F5C3EA0AB }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'efsmod-dev'
          slot-name: 'Production'
          package: ./aspnet-get-started
          